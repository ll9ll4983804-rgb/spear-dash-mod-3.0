name: Build Spear Dash Mod

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"

      - name: Apply source update from ZIP
        run: |
          mkdir -p /tmp/spear-dash-update
          unzip -q Spear-Dash-source-update.zip -d /tmp/spear-dash-update
          cp -R /tmp/spear-dash-update/spear-dash-update/src/. src/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: Spear-Dash-Mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
